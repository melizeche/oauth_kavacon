# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# CASO 6 — Mix-up: el cliente no valida el issuer (falla en el RP).
#
# El RP esta federado con DOS OPs y confia en ambos para algun proposito, asi
# que acepta como `aud` cualquiera de sus dos client_ids. Ambos providers firman
# con la MISMA clave (comparten infraestructura), de modo que la firma es valida
# para los dos. Lo UNICO que distingue de cual OP vino el token es el claim
# `iss`. Si el RP no lo valida, un id_token emitido por OP-Evil es aceptado en
# un panel que solo debia confiar en OP-Corp.
#
#   caso6-corp : el OP legitimo (corporativo) en el que el RP confia.
#   caso6-evil : el OP que el atacante controla.
#
# RFC 9207 (iss en la respuesta) · RFC 9700 §4.4 (mix-up).
version: 1
metadata:
  name: lab-caso6-mixup-issuer
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: caso6-corp-provider
    identifiers:
      name: caso6-corp
    attrs:
      name: caso6-corp
      client_id: caso6-corp
      client_secret: caso6-corp-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/caso6/corp-callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso6-corp-app
    identifiers:
      slug: caso6-corp
    attrs:
      name: 'OP-Corp (legítimo)'
      group: 'Caso 6 — mix-up / issuer'
      meta_icon: 'http://localhost:8081/static/secure.svg'
      slug: caso6-corp
      provider: !KeyOf caso6-corp-provider

  - model: authentik_providers_oauth2.oauth2provider
    id: caso6-evil-provider
    identifiers:
      name: caso6-evil
    attrs:
      name: caso6-evil
      client_id: caso6-evil
      client_secret: caso6-evil-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8082/caso6/evil-callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso6-evil-app
    identifiers:
      slug: caso6-evil
    attrs:
      name: 'OP-Evil (atacante)'
      group: 'Caso 6 — mix-up / issuer'
      meta_icon: 'http://localhost:8081/static/insecure.svg'
      slug: caso6-evil
      provider: !KeyOf caso6-evil-provider
