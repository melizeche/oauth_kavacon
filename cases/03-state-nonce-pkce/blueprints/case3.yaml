# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# CASO 3 — Falta de state / nonce / PKCE (la falla esta en el CLIENTE / RP).
#
# El OP esta BIEN configurado en ambas variantes (code flow, redirect estricto,
# RS256). La diferencia vive en el RP: la ruta insegura no genera ni valida
# state, nonce ni PKCE; la segura usa los tres. Por eso aca solo hace falta que
# el OP ofrezca un provider correcto por variante.
#
# Se agrega ademas un usuario "atacante" (cuenta propia del atacante) que se usa
# para escenificar el login-CSRF: el atacante consigue un code para SU cuenta y
# se lo inyecta a la victima.
#
# RFC 6749 §10.12 (CSRF / state) · RFC 7636 (PKCE) · OpenID Connect Core (nonce).
version: 1
metadata:
  name: lab-caso3-state-nonce-pkce
entries:
  - model: authentik_core.user
    id: user-atacante
    identifiers:
      username: atacante
    attrs:
      username: atacante
      name: Atacante Demo
      email: atacante@lab.local
      is_active: true
      path: users
      password: 12345

  # INSEGURO: provider correcto; la inseguridad la pone el RP.
  - model: authentik_providers_oauth2.oauth2provider
    id: caso3-insecure-provider
    identifiers:
      name: caso3-insecure
    attrs:
      name: caso3-insecure
      client_id: caso3-insecure
      client_secret: caso3-insecure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/caso3/insecure/callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso3-insecure-app
    identifiers:
      slug: caso3-insecure
    attrs:
      name: 'Caso 3 — sin state/nonce/PKCE (INSEGURO)'
      slug: caso3-insecure
      provider: !KeyOf caso3-insecure-provider

  # SEGURO: mismo OP correcto; el RP agrega state + nonce + PKCE.
  - model: authentik_providers_oauth2.oauth2provider
    id: caso3-secure-provider
    identifiers:
      name: caso3-secure
    attrs:
      name: caso3-secure
      client_id: caso3-secure
      client_secret: caso3-secure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/caso3/secure/callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso3-secure-app
    identifiers:
      slug: caso3-secure
    attrs:
      name: 'Caso 3 — con state/nonce/PKCE (SEGURO)'
      slug: caso3-secure
      provider: !KeyOf caso3-secure-provider
