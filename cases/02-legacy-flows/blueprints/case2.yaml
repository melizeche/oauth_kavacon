# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# CASO 2 — Flujos legacy habilitados (configuracion del OP).
#
#   caso2-insecure : habilita implicit (e hybrid). El RP pide
#                    response_type="id_token token" y el token vuelve en el
#                    #fragment de la URL, donde cualquier script de tercero
#                    cargado en la pagina lo lee.
#   caso2-secure   : solo [authorization_code, refresh_token]. El RP usa
#                    response_type=code y el token nunca aparece en la URL.
#
# RFC 9700 §2.1.2 (no usar implicit) · OpenID Connect Core (hybrid).
version: 1
metadata:
  name: lab-caso2-legacy-flows
entries:
  # ---------------------------------------------------------------------------
  # INSEGURO: implicit + hybrid habilitados.
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: caso2-insecure-provider
    identifiers:
      name: caso2-insecure
    attrs:
      name: caso2-insecure
      client_id: caso2-insecure
      client_secret: caso2-insecure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - implicit
        - hybrid
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/implicit-callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso2-insecure-app
    identifiers:
      slug: caso2-insecure
    attrs:
      name: 'Inseguro (implicit)'
      group: 'Caso 2 — flujos legacy'
      meta_icon: 'http://localhost:8081/static/insecure.svg'
      slug: caso2-insecure
      provider: !KeyOf caso2-insecure-provider

  # ---------------------------------------------------------------------------
  # SEGURO: solo authorization_code (+ refresh). Sin implicit ni hybrid.
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: caso2-secure-provider
    identifiers:
      name: caso2-secure
    attrs:
      name: caso2-secure
      client_id: caso2-secure
      client_secret: caso2-secure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso2-secure-app
    identifiers:
      slug: caso2-secure
    attrs:
      name: 'Seguro (code)'
      group: 'Caso 2 — flujos legacy'
      meta_icon: 'http://localhost:8081/static/secure.svg'
      slug: caso2-secure
      provider: !KeyOf caso2-secure-provider
