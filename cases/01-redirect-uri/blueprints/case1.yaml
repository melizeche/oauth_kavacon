# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
#
# CASO 1 — Validacion laxa de redirect_uri (configuracion del OP).
#
# Se crean DOS aplicaciones que coexisten:
#   caso1-insecure : matching_mode regex con un punto SIN escapar en el puerto.
#   caso1-secure   : matching_mode strict con la URL exacta.
#
# RFC 6749 §3.1.2 — el redirect_uri debe matchear por comparacion exacta de
# strings. RFC 9700 §2.1 recomienda explicitamente "exact string matching".
version: 1
metadata:
  name: lab-caso1-redirect-uri
entries:
  # ---------------------------------------------------------------------------
  # INSEGURO: regex con "." sin escapar. "808." matchea 8081 (RP legitimo) pero
  # TAMBIEN 8082 (el atacante). El code se entrega a cualquiera de los dos.
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: caso1-insecure-provider
    identifiers:
      name: caso1-insecure
    attrs:
      name: caso1-insecure
      client_id: caso1-insecure
      client_secret: caso1-insecure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:808.\/callback'
          matching_mode: regex
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso1-insecure-app
    identifiers:
      slug: caso1-insecure
    attrs:
      name: 'Caso 1 — redirect_uri laxa (INSEGURO)'
      slug: caso1-insecure
      provider: !KeyOf caso1-insecure-provider

  # ---------------------------------------------------------------------------
  # SEGURO: matching_mode strict con la URL literal exacta del RP.
  # ---------------------------------------------------------------------------
  - model: authentik_providers_oauth2.oauth2provider
    id: caso1-secure-provider
    identifiers:
      name: caso1-secure
    attrs:
      name: caso1-secure
      client_id: caso1-secure
      client_secret: caso1-secure-secret-no-usar-en-prod
      client_type: confidential
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: 'http://localhost:8081/callback'
          matching_mode: strict
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, lab-signing-cert]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: caso1-secure-app
    identifiers:
      slug: caso1-secure
    attrs:
      name: 'Caso 1 — redirect_uri estricta (SEGURO)'
      slug: caso1-secure
      provider: !KeyOf caso1-secure-provider
