<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lab OAuth/OIDC{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           max-width: 920px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; margin-top: 1.8rem; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { background: #11182722; padding: .8rem; border-radius: 8px; overflow-x: auto;
          border: 1px solid #8888; font-size: .85rem; }
    .btn { display: inline-block; padding: .55rem .9rem; border-radius: 8px;
           text-decoration: none; font-weight: 600; margin: .2rem .3rem .2rem 0; }
    .btn-ok { background: #16a34a; color: white; }
    .btn-bad { background: #dc2626; color: white; }
    .btn-plain { background: #374151; color: white; }
    .tag { display: inline-block; padding: .1rem .5rem; border-radius: 999px;
           font-size: .75rem; font-weight: 700; }
    .tag-bad { background: #dc262622; color: #dc2626; border: 1px solid #dc2626; }
    .tag-ok { background: #16a34a22; color: #16a34a; border: 1px solid #16a34a; }
    .card { border: 1px solid #8888; border-radius: 12px; padding: 1rem 1.2rem; margin: 1rem 0; }
    .muted { color: #6b7280; font-size: .9rem; }
    .rfc { font-size: .85rem; color: #6b7280; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <p class="muted"><a href="/">&larr; Indice de casos</a> · Lab OAuth 2.0 / OIDC · Kavacon 2026</p>
  {% block body %}{% endblock %}
</body>
</html>
