<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Falsificador de tokens</title>
  <style>
    html { background: #2e0c0c; min-height: 100%; }
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2.5rem auto;
           padding: 0 1.2rem; background: radial-gradient(1200px 560px at 50% -8%, #7a1d1d, #2e0c0c) fixed; color: #e5e5e5; }
    h1 { color: #ff5555; }
    code, pre { font-family: ui-monospace, Menlo, monospace; }
    pre { background: #161616; border: 1px solid #333; padding: .8rem; border-radius: 8px;
          overflow-x: auto; font-size: .78rem; word-break: break-all; white-space: pre-wrap; }
    .btn { display: inline-block; margin-top: 1rem; padding: .9rem 1.5rem; border-radius: 10px;
           background: #dc2626; color: white; font-weight: 800; font-size: 1.15rem;
           text-decoration: none; }
    .btn.disabled { background: #444; pointer-events: none; }
    .small { color: #888; font-size: .85rem; }
    .lbl { color: #ffb86c; font-weight: 700; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>🔨 Falsificador de id_token <span style="font-size:1rem;color:#c99">(token forging)</span></h1>
  <p>Falsifica un <code>id_token</code> con privilegios de admin, firmado <code>HS256</code> usando la
     clave <strong>pública</strong> del OP (que es conocida, está en el JWKS) como secreto HMAC.</p>
  <p class="small">Variante objetivo del RP: <strong>{{ variant }}</strong></p>

  <div class="lbl">Token falsificado:</div>
  <pre id="tok">generando&hellip;</pre>

  <a id="go" class="btn disabled" href="#" target="_blank">Enviar el token falsificado al RP ▶</a>
  <p class="small" id="info"></p>

  <script>
    const variant = {{ variant|tojson }};
    fetch('/caso4b/forge/token?variant=' + encodeURIComponent(variant))
      .then(r => r.json())
      .then(d => {
        if (d.token) {
          document.getElementById('tok').textContent = d.token;
          const go = document.getElementById('go');
          go.href = d.verify_url;
          go.classList.remove('disabled');
          document.getElementById('info').innerHTML =
            'Al enviarlo, el RP ' + (variant === 'insecure'
              ? 'inseguro lo <b>aceptará</b> como admin.'
              : 'seguro lo <b>rechazará</b>.');
        } else {
          document.getElementById('tok').textContent = 'Error: ' + (d.error || 'desconocido');
        }
      })
      .catch(e => { document.getElementById('tok').textContent = 'Error: ' + e; });
  </script>
</body>
</html>
